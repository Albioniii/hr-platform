<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="brand">
      <span class="logo"><mat-icon>badge</mat-icon></span>
      <span>PeopleDesk</span>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          [activated]="rla.isActive"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
          @if (item.path === '/approvals' && pendingCount() > 0) {
            <span matListItemMeta class="count">{{ pendingCount() }}</span>
          }
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Open menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>

      @if (user(); as u) {
        <button mat-button class="user-button" [matMenuTriggerFor]="userMenu">
          <span class="user-inner">
            <app-avatar [employee]="u" [size]="32" />
            <span class="user-text">
              <span class="user-name">{{ u.firstName }} {{ u.lastName }}</span>
              <span class="user-role">{{ u.role === 'manager' ? 'Manager' : 'Employee' }}</span>
            </span>
          </span>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <a mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>My profile</span>
          </a>
          <button mat-menu-item (click)="resetDemo()">
            <mat-icon>restart_alt</mat-icon>
            <span>Reset demo data</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Log out</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
